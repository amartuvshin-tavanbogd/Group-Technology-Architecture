<!DOCTYPE html>
<html lang="mn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Группын технологийн архитектур — 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>

:root{
  --ink:#16202B; --ink2:#54636F; --ink3:#8494A0;
  --paper:#E9EEF2; --panel:#FFF; --rule:#C7D2DA; --rule2:#E3EAEF;
  --aws:#1F6FEB; --dc:#43505C; --ven:#1E7A46;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--paper);
  background-image:linear-gradient(to right,rgba(22,32,43,.04) 1px,transparent 1px),
                   linear-gradient(to bottom,rgba(22,32,43,.04) 1px,transparent 1px);
  background-size:26px 26px;
  color:var(--ink);font-family:"IBM Plex Sans",system-ui,sans-serif;font-size:15px;line-height:1.5}

.shell{max-width:1560px;margin:0 auto;padding:26px 20px 60px;position:relative}
#wires{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5;overflow:visible}
#wires path{fill:none;stroke-width:2;stroke-dasharray:7 6;opacity:.85}
@media (prefers-reduced-motion:no-preference){
  #wires path{animation:flow 1.1s linear infinite}
  @keyframes flow{to{stroke-dashoffset:-26}}
}
#wires circle{stroke:#fff;stroke-width:1.5}

/* ---------- header ---------- */
.top{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-end;
  border-bottom:2px solid var(--ink);padding-bottom:16px;margin-bottom:18px}
h1{font-family:Manrope,sans-serif;font-weight:800;font-size:clamp(21px,2.5vw,32px);
   letter-spacing:-.025em;line-height:1.1;margin:0}
.top .sub{margin:4px 0 0;color:var(--ink2);font-size:14px}
.tools{display:flex;gap:10px;margin-left:auto;align-items:center;flex-wrap:wrap}
#q{font:inherit;font-size:14px;padding:8px 12px;border:1px solid var(--rule);
   border-radius:3px;background:#fff;width:190px}
#q:focus{outline:2px solid var(--aws);outline-offset:-1px}
.seg{display:inline-flex;border:1px solid var(--ink);border-radius:2px;overflow:hidden}
.seg button{font:inherit;font-family:Manrope,sans-serif;font-weight:600;font-size:13px;
  border:0;background:transparent;color:var(--ink2);padding:8px 13px;cursor:pointer;white-space:nowrap}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--aws);outline-offset:-3px}

/* ---------- layers ---------- */
.layer{display:grid;grid-template-columns:186px 1fr;gap:14px;align-items:center;
  background:var(--tint);border:1px solid var(--edge);border-left:7px solid var(--acc);
  border-radius:10px;padding:11px 14px;margin-bottom:11px;position:relative;z-index:2}
.layer .lh h3{font-family:Manrope,sans-serif;font-weight:700;font-size:16px;margin:0;color:var(--acc)}
.layer .lh span{font-size:11.5px;color:var(--ink3)}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(148px,1fr));gap:8px}

/* ---------- columns ---------- */
.cols{display:grid;grid-template-columns:0.85fr 78px 1.85fr 78px 0.85fr;margin:15px 0;
  position:relative;z-index:2}
.col{background:var(--panel);border:1px solid var(--edge);border-radius:12px;overflow:hidden;
  align-self:start}
.col > header{background:var(--head);color:#fff;padding:12px 16px;display:flex;
  align-items:baseline;gap:10px}
.col > header h2{font-family:Manrope,sans-serif;font-weight:800;font-size:18px;margin:0;
  letter-spacing:-.015em}
.col > header p{margin:1px 0 0;font-size:11.5px;opacity:.82}
.col > header .cnt{margin-left:auto;font-family:Manrope,sans-serif;font-weight:800;font-size:15px;
  opacity:.9;font-variant-numeric:tabular-nums}
.col .body{padding:5px 14px 14px}

.grp{padding-top:11px}
.grp > .gh{width:100%;display:flex;align-items:center;gap:8px;border:0;background:transparent;
  font:inherit;font-family:Manrope,sans-serif;font-weight:700;font-size:12.5px;color:var(--head);
  padding:0 0 6px;margin:0;border-bottom:1px solid var(--rule2);cursor:pointer;text-align:left}
.grp > .gh .chev{font-size:10px;color:var(--ink3);transform:rotate(90deg);line-height:1}
.grp > .gh .num{margin-left:auto;font-weight:700;font-size:11px;color:var(--ink3);
  font-variant-numeric:tabular-nums}
.grp > .gh:focus-visible{outline:2px solid var(--aws);outline-offset:2px}
.grp.shut > .gh{background:#F3F6F8;border:1px solid var(--rule2);border-radius:6px;
  padding:9px 11px;margin-bottom:0}
.grp.shut > .gh .chev{transform:none}
.grp.shut .g3{display:none}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding-top:7px}
.g3 .wide{grid-column:1/-1}

/* ---------- nodes ---------- */
.node{background:#fff;border:1px solid var(--rule2);border-left:4px solid var(--acc,var(--rule));
  border-radius:4px;padding:7px 9px;cursor:pointer;text-align:left;font:inherit;display:block;width:100%}
.node b{display:block;font-family:Manrope,sans-serif;font-weight:700;font-size:12.5px;
  letter-spacing:-.005em;line-height:1.25}
.node small{display:block;font-size:10.5px;color:var(--ink2);margin-top:2px;line-height:1.3}
.node:hover{border-color:var(--acc)}
.node:focus-visible{outline:2px solid var(--aws);outline-offset:1px}
.node[aria-current="true"]{background:var(--ink);border-color:var(--ink)}
.node[aria-current="true"] b{color:#fff}
.node[aria-current="true"] small{color:#C3CED7}
.node.rel{box-shadow:0 0 0 2px #1E7A46 inset;border-color:#1E7A46}
body.filtering .node:not(.hit){opacity:.18}
body.overview .node small{display:none}
body.overview .node{padding:8px 9px}


/* ---------- company rail ---------- */
.rail{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 16px;
  position:relative;z-index:2}
.rail .lbl{font-size:12px;color:var(--ink3);margin-right:4px}
.rail button{font:inherit;font-family:Manrope,sans-serif;font-weight:600;font-size:12px;
  letter-spacing:0;background:#fff;border:1px solid var(--rule);border-radius:20px;
  padding:5px 11px;cursor:pointer;color:var(--ink2);display:inline-flex;gap:6px;align-items:center}
.rail button i{font-style:normal;font-weight:500;font-size:10.5px;color:var(--ink3)}
.rail button:hover{border-color:var(--ink3)}
.rail button[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.rail button[aria-pressed="true"] i{color:#B6C3CD}
.rail button:focus-visible{outline:2px solid var(--aws);outline-offset:2px}

/* ---------- company chips on nodes ---------- */
.co{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px}
.co em{font-style:normal;font-family:Manrope,sans-serif;font-weight:600;font-size:9.5px;
  letter-spacing:0;background:#F0F4F7;border:1px solid var(--rule2);border-radius:3px;
  padding:1px 5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  max-width:100%}
.co em.many{background:transparent;border:0;font-weight:600;font-size:10px;color:var(--ink3);
  letter-spacing:0;padding:1px 0}
.co em.on{background:var(--acc);border-color:var(--acc);color:#fff}
.node[aria-current="true"] .co em{background:#2E3B48;border-color:#3E4C5A;color:#C3CED7}
.node.sunset{opacity:.55;border-left-style:dashed}
.node.sunset b{text-decoration:line-through;text-decoration-thickness:1px}
.node .off{display:none;font-family:Manrope,sans-serif;font-weight:700;font-size:9px;
  letter-spacing:.03em;color:#B8392C;border:1px solid #E3B4AF;border-radius:3px;
  padding:1px 5px;margin-top:6px}
.node.sunset .off{display:inline-block}
body.overview .co{display:none}
body.overview .node .off{display:none}
body.co-focus .node:not(.co-hit):not([data-plat="layer"]){opacity:.16}


/* ---------- pods (flat data center grid) ---------- */
.pods{display:grid;grid-template-columns:repeat(auto-fill,minmax(146px,1fr));gap:6px;padding-top:11px}
.pods .node{padding:7px 8px}
.pods .node b{font-size:11.5px;line-height:1.2}
.pods .node small{font-size:9.5px;margin-top:1px;color:var(--ink3)}
body.overview .pods{grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:5px}
body.overview .pods .node{padding:6px 7px}

/* ---------- integration layer pods ---------- */
.layer .row.pods{grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:6px;padding-top:0}
.layer .row.pods .node b{font-size:11.5px}
.layer .row.pods .node small{font-size:9.5px;color:var(--ink3)}
body.overview .layer .row.pods{grid-template-columns:repeat(auto-fill,minmax(132px,1fr))}

.patleg{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:9px;
  padding-top:8px;border-top:1px solid var(--edge)}
.patleg span{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:var(--ink2)}
.patleg i{width:9px;height:9px;border-radius:2px;background:var(--pc);flex:0 0 auto}
.patleg b{font-family:Manrope,sans-serif;font-weight:700;font-size:10.5px;color:var(--pc)}
.patleg em{font-style:normal}
body.overview .patleg{display:none}

/* ---------- drawer meta ---------- */
.meta{border-top:1px solid var(--rule2);margin:-6px 0 18px}
.meta > div{display:grid;grid-template-columns:104px 1fr;gap:10px;padding:7px 0;
  border-bottom:1px solid var(--rule2);font-size:12.5px}
.meta > div > span{color:var(--ink3)}
.meta > div > b{font-weight:600;color:var(--ink)}
.meta .pats{display:flex;flex-direction:column;gap:3px}
.meta .pats i{font-style:normal;font-weight:600;font-size:11.5px;color:var(--pc);
  border-left:3px solid var(--pc);padding-left:6px}

/* ---------- connectors ---------- */
.conn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:34px 0;position:relative}
.conn .line{position:absolute;top:28px;bottom:28px;width:0;border-left:3px dashed var(--c)}
.conn .cap{writing-mode:vertical-rl;transform:rotate(180deg);background:var(--paper);
  border:1px solid var(--c);color:var(--c);border-radius:20px;padding:16px 5px;
  font-family:Manrope,sans-serif;font-weight:700;font-size:11.5px;position:relative;text-align:center}

/* ---------- drawer ---------- */
.drawer{position:fixed;top:0;right:0;height:100vh;width:346px;background:#fff;
  border-left:1px solid var(--rule);box-shadow:-8px 0 28px rgba(22,32,43,.13);
  transform:translateX(100%);z-index:30;display:flex;flex-direction:column}
.drawer.open{transform:none}
@media (prefers-reduced-motion:no-preference){.drawer{transition:transform .22s ease}}
.drawer header{padding:20px 20px 14px;border-bottom:1px solid var(--rule2)}
.drawer .badge{display:inline-block;font-size:11px;font-weight:600;padding:2px 8px;border-radius:2px;
  color:#fff;margin-bottom:8px}
.drawer h3{font-family:Manrope,sans-serif;font-weight:800;font-size:20px;margin:0;letter-spacing:-.015em}
.drawer .where{font-size:12.5px;color:var(--ink3);margin-top:2px}
.drawer .content{padding:16px 20px 30px;overflow:auto}
.drawer .content p{margin:0 0 18px;font-size:14px;color:var(--ink2)}
.drawer h5{font-family:Manrope,sans-serif;font-size:12px;font-weight:700;margin:0 0 8px;color:var(--ink3)}
.drawer .links{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:20px}
.drawer .links button{font:inherit;font-size:12px;background:#fff;border:1px solid var(--rule);
  border-left:4px solid var(--lc);border-radius:3px;padding:4px 9px;cursor:pointer}
.drawer .links button:hover{border-color:var(--lc)}
.copy{font:inherit;font-size:12.5px;background:#F3F6F8;border:1px solid var(--rule);
  border-radius:3px;padding:6px 11px;cursor:pointer;color:var(--ink2)}
.close{position:absolute;top:14px;right:14px;border:0;background:transparent;font-size:22px;
  line-height:1;cursor:pointer;color:var(--ink3);padding:4px 8px}
.close:hover{color:var(--ink)}

.foot{border-top:2px solid var(--ink);margin-top:24px;padding-top:14px;color:var(--ink3);
  font-size:12.5px;display:flex;flex-wrap:wrap;gap:18px;position:relative;z-index:2}

@media (max-width:1080px){
  .cols{grid-template-columns:1fr}
  .conn{padding:14px 0;flex-direction:row}
  .conn .line{position:static;border-left:0;border-top:3px dashed var(--c);width:100%;height:0;
    align-self:center;margin:0 -100%}
  .conn .cap{writing-mode:horizontal-tb;transform:none;padding:6px 14px}
  .layer{grid-template-columns:1fr}
  .drawer{width:100%}
  #wires{display:none}
}
@media print{
  body{background:#fff}
  .tools,.drawer,.conn .line,#wires{display:none}
  .col,.layer{break-inside:avoid}
  .grp.shut .g3{display:grid}
}

/* ---------- компанийн тэмдэг ---------- */
.mark{display:inline-flex;align-items:center;justify-content:center;flex:0 0 auto;
  width:19px;height:19px;border-radius:4px;background:var(--mc);color:#fff;
  font-family:Manrope,sans-serif;font-weight:800;font-size:8.5px;letter-spacing:.02em}
.rail button{display:inline-flex;align-items:center;gap:6px}
.rail button .mark{width:17px;height:17px;font-size:8px}
.node .co em{display:inline-flex;align-items:center;gap:4px}
.node .co em .mark{width:14px;height:14px;font-size:7px;border-radius:3px}
#d-co button{display:inline-flex;align-items:center;gap:6px}

/* ---------- нүүлгэлт ба DR ---------- */
.node .mv{display:none;position:absolute;top:5px;right:6px;font-family:Manrope,sans-serif;
  font-weight:800;font-size:8px;letter-spacing:.03em;color:#1F6FEB;
  border:1px solid #9CC0F0;border-radius:3px;padding:0 3px;background:#EDF4FE}
body.tgt .node.moved .mv{display:block}
.node.moved{box-shadow:inset 0 0 0 1px #9CC0F0}
.site{display:flex;align-items:center;gap:6px;margin-top:5px;font-size:9.5px;
  color:#fff;opacity:.82;font-family:Manrope,sans-serif;font-weight:600}
.site b{font-weight:800;letter-spacing:.03em}
.site s{text-decoration:none;opacity:.55}
.col header .cnt{align-self:flex-start}
.acct{grid-column:1/-1;font-size:9.5px;color:var(--ink3);padding:2px 0 0}

/* ---------- хэлний товч ---------- */
.seg.lang button{min-width:34px;font-family:Manrope,sans-serif;font-weight:800;letter-spacing:.04em}

/* ---------- бодит лого ---------- */
.mark.logo{width:31px;height:19px;border-radius:3px;background:#fff;
  border:1px solid var(--rule2);padding:1px;overflow:hidden}
.mark.logo img{width:100%;height:100%;object-fit:contain;display:block}
.rail button .mark.logo{width:29px;height:17px}
.node .co em .mark.logo{width:23px;height:14px;border-radius:2px;padding:0}
#d-co button .mark.logo{width:33px;height:20px}
body.overview .node .co em .mark.logo{width:20px;height:13px}

/* ---------- хувилбарын тэмдэг ---------- */
.top .right{margin-left:auto;display:flex;flex-direction:column;align-items:flex-end;gap:9px}
.top .right .tools{margin-left:0}
.ver{font-family:Manrope,sans-serif;font-weight:800;font-size:11.5px;letter-spacing:.06em;
  text-transform:uppercase;color:var(--ink2);background:#fff;
  border:1px solid var(--ink);border-radius:20px;padding:4px 13px;white-space:nowrap}

/* ---------- дээд хэсгийг нягтруулж, агуулгыг дээшлүүлэх ---------- */
.shell{padding:14px 20px 46px}

h1{font-size:clamp(17px,1.85vw,24px);letter-spacing:-.02em}
.top{gap:12px;padding-bottom:10px;margin-bottom:11px}
.top .sub{margin:3px 0 0;font-size:12.5px}
.top .right{gap:7px}
.ver{font-size:10px;letter-spacing:.05em;padding:3px 10px}

.tools{gap:7px}
#q{font-size:12.5px;padding:6px 10px;width:168px}
.seg button{font-size:12px;padding:6px 11px}
.seg.lang button{min-width:30px}

.rail{gap:5px;margin:0 0 10px}
.rail .lbl{font-size:11.5px}

.layer{padding:9px 13px;margin-bottom:9px;gap:12px;grid-template-columns:170px 1fr}
.layer .lh h3{font-size:15px}
.layer .lh span{font-size:11px}
.cols{margin:11px 0}
.col > header{padding:10px 14px}
.col > header h2{font-size:16.5px}
.col > header p{font-size:11px}
.col .body{padding:4px 13px 12px}
.foot{margin-top:18px;padding-top:11px;font-size:12px;gap:14px}

/* ---------- бүлэггүй, дан систем ---------- */
.solo{padding-top:11px;border-top:1px solid var(--rule2);margin-top:11px}
.solo .g3{padding-top:0}
.col .body > .solo:first-child{border-top:0;margin-top:0}

</style>
</head>
<body class="overview">
<div class="shell" id="shell">
<svg id="wires" aria-hidden="true"></svg>

<div class="top">
  <div>
    <h1 data-tx="h1"></h1>
    <p class="sub"><span id="n-app">0</span> <span data-tx="sub_app"></span>,
      <span data-tx="sub_site"></span>, <span id="n-co">0</span> <span data-tx="sub_co"></span>,
      <span id="n-int">0</span> <span data-tx="sub_int"></span></p>
  </div>
  <div class="right">
  <span class="ver" data-tx="ver"></span>
  <div class="tools">
    <input id="q" type="search" data-tx-ph="ph" data-tx-aria="aria_q">
    <div class="seg lang" role="group" data-tx-aria="aria_lang">
      <button data-lang="mn" aria-pressed="true">MN</button>
      <button data-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="seg" role="group" data-tx-aria="aria_state">
      <button data-s="cur" aria-pressed="true" data-tx="s_cur"></button>
      <button data-s="tgt" aria-pressed="false" data-tx="s_tgt"></button>
    </div>
    <div class="seg" role="group" data-tx-aria="aria_mode">
      <button data-m="overview" aria-pressed="true" data-tx="m_over"></button>
      <button data-m="detail" aria-pressed="false" data-tx="m_detail"></button>
    </div>
    <div class="seg" role="group" data-tx-aria="aria_plat">
      <button data-f="all" aria-pressed="true" data-tx="f_all"></button>
      <button data-f="aws" aria-pressed="false">AWS</button>
      <button data-f="dc" aria-pressed="false" data-tx="f_dc"></button>
      <button data-f="ven" aria-pressed="false">Vendor</button>
    </div>
  </div>
  </div>
</div>

<div class="rail" id="rail"><span class="lbl" data-tx="rail_lbl"></span></div>
<div id="top-layers"></div>
<div class="cols" id="cols"></div>
<div id="bot-layers"></div>

<div class="foot">
  <span data-tx="foot1"></span>
  <span data-tx="foot2"></span>
  <span data-tx="foot3"></span>
  <span data-tx="foot4"></span>
  <span data-tx="foot5"></span>
  <span data-tx="foot6"></span>
  <span data-tx="foot7" style="margin-left:auto"></span>
</div>
</div>

<aside class="drawer" id="drawer" aria-hidden="true">
  <button class="close" id="close" data-tx-aria="d_close">&#215;</button>
  <header>
    <span class="badge" id="d-badge"></span>
    <h3 id="d-name"></h3>
    <div class="where" id="d-where"></div>
  </header>
  <div class="content">
    <p id="d-note"></p>
    <div id="d-meta"></div>
    <h5 data-tx="d_co"></h5>
    <div class="links" id="d-co"></div>
    <h5 data-tx="d_links"></h5>
    <div class="links" id="d-links"></div>
    <button class="copy" id="d-copy" data-tx="d_copy"></button>
  </div>
</aside>

<script>
/* ============ i18n ============ */
let lang = "mn";
const L2 = s => {
  if(typeof s !== "string") return s;
  const i = s.indexOf("|");
  return i < 0 ? s : (lang === "mn" ? s.slice(0, i) : s.slice(i + 1));
};

const TX = {
  ver:       "Хувилбар 1|Version 1",
  h1:        "Группын технологийн архитектур — 2026|Group Technology Architecture — 2026",
  sub_app:   "аппликейшн|applications",
  sub_site:  "гурван байршил|three locations",
  sub_co:    "компани|companies",
  sub_int:   "integration service|integration services",
  ph:        "Хайх: Odoo, POS, portal, dtb_ecosystem…|Search: Odoo, POS, portal, dtb_ecosystem…",
  aria_q:    "Хайх|Search",
  aria_state:"Төлөв|State",
  aria_mode: "Дэлгэрэнгүйн хэмжээ|Level of detail",
  aria_plat: "Платформоор шүүх|Filter by platform",
  aria_lang: "Хэл|Language",
  s_cur:     "Одоо|Current",
  s_tgt:     "Зорилтот|Target",
  m_over:    "Ерөнхий|Overview",
  m_detail:  "Дэлгэрэнгүй|Detail",
  f_all:     "Бүгд|All",

function mark(c){
  const m = document.createElement("span");
  if(LOGO[c]){
    m.className = "mark logo";
    const img = document.createElement("img");
    img.src = LOGO[c];
    img.alt = coName(c);
    img.loading = "lazy";
    m.appendChild(img);
  } else {
    m.className = "mark";
    m.style.setProperty("--mc", coColor(c));
    m.textContent = c;
  }
  return m;
}

const movedNow = () => state === "tgt" ? MOVE_TGT : [];
const intoLifeNow = () => state === "tgt" ? TGT_INTO_LIFE : [];

function awsGroups(){
  const g = AWS_ACCOUNTS.map(([acct, sys]) => [
    acct,
    sys.map(n => {
      const row = DC_APPS.find(a => a[0] === n) ||
                  LIFE_APPS.find(a => a[0] === n) ||
                  FIN_APPS.find(a => a[0] === n) ||
                  AWS_OTHER.find(a => a[0] === n);
      return row ? row.slice() : [n, "—|—"];
    })
  ]);
  intoLifeNow().forEach(n => {
    const i = AWS_ACCOUNTS.findIndex(a => a[0] === "TBGLife");
    g[i][1].push([n, "TBG Life-д нэгдэнэ|Merges into TBG Life"]);
  });
  const mv = movedNow();
  if(mv.length){
    g.push(["ДЦ-ээс нүүх — account тодруулах|Migrating from DC — account to confirm",
      mv.map(n => {
        const r = DC_APPS.find(a => a[0] === n);
        return [n, r ? r[1] : "—|—"];
      })]);
  }
  return g;
}
function dcApps(){
  const mv = movedNow();
  return DC_APPS.filter(a => !mv.includes(a[0]));
}
function venGroups(){
  const out = intoLifeNow();
  return VEN_GROUPS.map(([n, items]) => [n, items.filter(i => !out.includes(i[0]))])
                   .filter(([, items]) => items.length);
}

  b.querySelector("small").textContent = L2(note);
  b.querySelector(".off").textContent = T("n_off");
  b.dataset.plat = plat; b.dataset.name = name; b.dataset.group = L2(group);
  if(MOVE_TGT.includes(name)) b.classList.add("moved");
  const M = API_META[name];
  if(M){
    b.dataset.tech = M.tech;
    b.dataset.pat = M.pat.join("");
    b.title = M.tech;
  }
  b.onclick = () => select(name);
  byName.set(name, b);
  accOf.set(name, acc);
  if(plat !== "layer" && !nocount) appCount++;
  return b;
}

function patLegend(){
  const w = document.createElement("div");
  w.className = "patleg";
  Object.keys(PAT).forEach(k => {
    const s = document.createElement("span");
    s.style.setProperty("--pc", PAT[k].c);
    s.innerHTML = "<i></i><b></b><em></em>";
    s.querySelector("b").textContent = k;
    s.querySelector("em").textContent = L2(PAT[k].n);
    w.appendChild(s);
  });
  return w;
}

function buildLayers(pos, host){
  LAYERS.filter(L => L.pos === pos).forEach(L => {
    const el = document.createElement("section");
    el.className = "layer";
    el.style.setProperty("--tint", L.tint);
    el.style.setProperty("--edge", L.edge);
    el.style.setProperty("--acc", L.acc);
    const lh = document.createElement("div");
    lh.className = "lh";
    lh.innerHTML = "<h3></h3><span></span>";
    lh.querySelector("h3").textContent = L2(L.name);
    lh.querySelector("span").textContent = L.legend
      ? L.no + " — " + L.items.length + " " + T("l_legend")
      : L.no + " — " + T("l_all");
    el.appendChild(lh);
    const row = document.createElement("div");
    row.className = L.dense ? "row pods" : "row";
    L.items.forEach(([n, s, acc]) =>
      row.appendChild(node(n, s, "layer", L.name, acc || L.acc)));
    el.appendChild(row);
    if(L.legend) el.appendChild(patLegend());
    host.appendChild(el);
  });
}

function group(C, gname, items, P, body){
  const g = document.createElement("div");
  const isOpen = (C.open || []).includes(gname);
  g.className = "grp" + (isOpen ? "" : " shut");
  if(isOpen) g.dataset.keep = "1";
  const gh = document.createElement("button");
  gh.className = "gh";
  gh.type = "button";
  gh.innerHTML = "<span class='chev'>&#9656;</span><span class='gn'></span><span class='num'></span>";
  gh.querySelector(".gn").textContent = L2(gname);
  gh.querySelector(".num").textContent = items.length;
  gh.setAttribute("aria-expanded", String(isOpen));
  gh.onclick = () => {
    g.classList.toggle("shut");
    gh.setAttribute("aria-expanded", String(!g.classList.contains("shut")));
    draw();
  };
  g.appendChild(gh);
  const grid = document.createElement("div");
  grid.className = "g3";
  items.forEach(([n, s, wide, nc]) => grid.appendChild(node(n, s, C.p, gname, P.color, wide, nc)));
  g.appendChild(grid);
  body.appendChild(g);
}

function buildColumns(){
  const host = $("cols");
  const ag = awsGroups();
  const multi = ag.filter(g => g[1].length > 1);
  const singles = ag.filter(g => g[1].length === 1).map(g => [g[0], g[1][0]]);
  const cols = [
    {p:"aws", groups:multi, singles:singles, open:multi.map(g => g[0])},
    {p:"dc",  flat:true, apps:dcApps()},
    {p:"ven", groups:venGroups(), open:venGroups().map(g => g[0])}
  ];
  cols.forEach((C, i) => {
    const P = PLAT[C.p];
    const col = document.createElement("section");
    col.className = "col";
    col.style.setProperty("--edge", P.edge);
    col.style.setProperty("--head", P.head);
    const total = C.flat ? C.apps.length
      : C.groups.reduce((n, g) => n + g[1].length, 0) + (C.singles ? C.singles.length : 0);

    const hd = document.createElement("header");
    hd.innerHTML = "<div><h2></h2><p></p><div class='site'></div></div><span class='cnt'></span>";
    hd.querySelector("h2").textContent = P.name;
    hd.querySelector("p").textContent = L2(P.sub);
    hd.querySelector(".cnt").textContent = total;
    const st = hd.querySelector(".site");
    if(P.site && P.site[0]){
      const a = document.createElement("b"); a.textContent = L2(P.site[0]); st.appendChild(a);
      if(P.site[1]){
        const sep = document.createElement("s"); sep.textContent = "·"; st.appendChild(sep);
        const d = document.createElement("b"); d.textContent = L2(P.site[1]); st.appendChild(d);
      }
    } else st.remove();
    col.appendChild(hd);

    const body = document.createElement("div");
    body.className = "body";
    if(C.flat){
      const pods = document.createElement("div");
      pods.className = "pods";
      C.apps.forEach(([n, cat]) => pods.appendChild(node(n, cat, C.p, cat, P.color)));
      body.appendChild(pods);
    } else {
      C.groups.forEach(([gname, items]) => group(C, gname, items, P, body));
      if(C.singles && C.singles.length){
        const solo = document.createElement("div");
        solo.className = "solo";
        const grid = document.createElement("div");
        grid.className = "g3";
        C.singles.forEach(([acct, [n, s, wide]]) =>
          grid.appendChild(node(n, s, C.p, acct, P.color, wide)));
        solo.appendChild(grid);
        body.appendChild(solo);
      }
    }
    col.appendChild(body);
    host.appendChild(col);
    if(i < CONNECTORS.length) addConnector(host, i);
  });
}

function addConnector(host, i){
  const c = document.createElement("div");
  c.className = "conn";
  c.style.setProperty("--c", CONNECTORS[i].color);
  const line = document.createElement("span"); line.className = "line";
  const cap = document.createElement("span"); cap.className = "cap";
  cap.textContent = CONNECTORS[i].label;
  c.append(line, cap);
  host.appendChild(c);
}

/* ---------- шугам ---------- */
const svg = $("wires");
const shell = $("shell");

function draw(){
  svg.textContent = "";
  if(!selected) return;
  const src = byName.get(selected);
  if(!src || !src.offsetParent) return;
  const links = linksFor(selected);
  const color = accOf.get(selected) || "#54636F";
  const s = shell.getBoundingClientRect();
  const a = src.getBoundingClientRect();

  links.forEach(n => {
    const t = byName.get(n);
    if(!t || !t.offsetParent) return;
    const b = t.getBoundingClientRect();
    let ax = a.left + a.width/2 - s.left, bx = b.left + b.width/2 - s.left, ay, by, d;
    if(b.top >= a.bottom - 4){
      ay = a.bottom - s.top; by = b.top - s.top;
      const m = (ay + by) / 2;
      d = `M${ax} ${ay} C ${ax} ${m}, ${bx} ${m}, ${bx} ${by}`;
    } else if(b.bottom <= a.top + 4){
      ay = a.top - s.top; by = b.bottom - s.top;
      const m = (ay + by) / 2;
      d = `M${ax} ${ay} C ${ax} ${m}, ${bx} ${m}, ${bx} ${by}`;
    } else {
      const right = bx > ax;
      ax = (right ? a.right : a.left) - s.left;
      bx = (right ? b.left : b.right) - s.left;
      ay = a.top + a.height/2 - s.top; by = b.top + b.height/2 - s.top;
      const m = (ax + bx) / 2;
      d = `M${ax} ${ay} C ${m} ${ay}, ${m} ${by}, ${bx} ${by}`;
    }
    const p = document.createElementNS(NS, "path");
    p.setAttribute("d", d);
    p.setAttribute("stroke", color);
    svg.appendChild(p);
    const c = document.createElementNS(NS, "circle");
    c.setAttribute("cx", bx); c.setAttribute("cy", by); c.setAttribute("r", 4);
    c.setAttribute("fill", color);
    svg.appendChild(c);
  });
}

function linksFor(name){
  const el = byName.get(name);
  if(!el) return [];
  const plat = el.dataset.plat;
  return (LINKS[name] || (plat === "layer" ? [] : DEFAULT_LINKS[plat]) || [])
         .filter(n => byName.has(n));
}

function reveal(el){
  if(!el) return;
  const g = el.closest(".grp");
  if(g && g.classList.contains("shut")){
    g.classList.remove("shut");
    g.querySelector(".gh").setAttribute("aria-expanded","true");
  }
}

/* ---------- сонголт ---------- */
function metaRow(box, k, v, cls){
  const r = document.createElement("div");
  r.innerHTML = "<span></span><b></b>";
  r.querySelector("span").textContent = k;
  const b = r.querySelector("b");
  b.textContent = v;
  if(cls) b.className = cls;
  box.appendChild(r);
  return r;
}

function select(name, scroll){
  const el = byName.get(name);
  if(!el) return;
  if(selected === name){ closeDrawer(); return; }
  selected = name;
  reveal(el);
  byName.forEach(b => { b.setAttribute("aria-current", String(b === el)); b.classList.remove("rel"); });

  const links = linksFor(name);
  links.forEach(n => { const t = byName.get(n); reveal(t); if(t) t.classList.add("rel"); });

  const plat = el.dataset.plat, P = PLAT[plat];
  const badge = $("d-badge");
  badge.textContent = P ? P.name : T("d_intlayer");
  badge.style.background = P ? P.color : accOf.get(name);
  $("d-name").textContent = name;
  $("d-where").textContent = (P ? P.name : T("d_intlayer")) + " · " + el.dataset.group;

  const M = API_META[name];
  $("d-note").textContent = M ? L2(M.note) : el.querySelector("small").textContent;

  const mb = $("d-meta");
  mb.textContent = "";
  mb.className = "meta";
  if(M){
    metaRow(mb, T("d_module"), M.tech);
    metaRow(mb, T("d_ops"), M.ops + " endpoint");
    metaRow(mb, T("d_ext"), L2(M.ext));
  }
  metaRow(mb, T("d_stack"), STACK[name] || T("d_tbd"));
  if(plat === "dc" && P.site && P.site[0]){
    metaRow(mb, T("d_site"),
      [L2(P.site[0]), P.site[1] ? L2(P.site[1]) : null].filter(Boolean).join(" · "));
  }
  if(plat === "aws" && AWS_ACCOUNTS.some(x => x[0] === el.dataset.group)){
    metaRow(mb, T("d_acct"), el.dataset.group);
  }
  if(MOVE_TGT.includes(name)) metaRow(mb, T("d_moving"), T("d_move_v"));
  if(M){
    const pr = document.createElement("div");
    pr.innerHTML = "<span></span>";
    pr.querySelector("span").textContent = T("d_pat");
    const pw = document.createElement("b");
    pw.className = "pats";
    M.pat.forEach(k => {
      const t = document.createElement("i");
      t.style.setProperty("--pc", PAT[k].c);
      t.textContent = k + " · " + L2(PAT[k].n);
      pw.appendChild(t);
    });
    pr.appendChild(pw);
    mb.appendChild(pr);
  }
  if(!mb.children.length) mb.className = "";

  const cob = $("d-co");
  cob.textContent = "";
  const clist = coOf(name, state);
  if(clist === null){
    const s = document.createElement("span");
    s.style.cssText = "font-size:12.5px;color:var(--ink3)";
    s.textContent = plat === "layer" ? T("d_nolayer") : T("d_co_tbd");
    cob.appendChild(s);
  } else if(!clist.length){
    const s = document.createElement("span");
    s.style.cssText = "font-size:12.5px;color:#B8392C";
    s.textContent = T("d_sunset");
    cob.appendChild(s);
  } else clist.forEach(c => {
    const cb = document.createElement("button");
    cb.appendChild(mark(c));
    const t = document.createElement("span");
    t.textContent = coName(c);
    cb.appendChild(t);
    cb.style.setProperty("--lc", coColor(c));
    cb.onclick = () => { coFilter = c; buildRail(); paintCompanies(); };
    cob.appendChild(cb);
  });

  const box = $("d-links");
  box.textContent = "";
  if(!links.length){
    const s = document.createElement("span");
    s.style.cssText = "font-size:12.5px;color:var(--ink3)";
    s.textContent = T("d_allplat");
    box.appendChild(s);
  }
  links.forEach(n => {
    const b = document.createElement("button");
    b.textContent = n;
    b.style.setProperty("--lc", accOf.get(n));
    b.onclick = () => { select(n, true); };
    box.appendChild(b);
  });

  const d = $("drawer");
  d.classList.add("open");
  d.setAttribute("aria-hidden","false");
  history.replaceState(null, "", "#" + slug(name));
  requestAnimationFrame(draw);
  if(scroll) el.scrollIntoView({block:"center", behavior:"smooth"});
}

function closeDrawer(){
  selected = null;
  byName.forEach(b => { b.setAttribute("aria-current","false"); b.classList.remove("rel"); });
  const d = $("drawer");
  d.classList.remove("open");
  d.setAttribute("aria-hidden","true");
  history.replaceState(null, "", location.pathname);
  draw();
}

function applyFilter(){
  const active = filter !== "all" || query.length > 0;
  document.body.classList.toggle("filtering", active);
  document.body.classList.toggle("co-focus", !!coFilter);
  byName.forEach((b, name) => {
    const okPlat = filter === "all" || b.dataset.plat === filter;
    const okText = !query || (name + " " + b.dataset.group + " " +
      (b.dataset.tech || "") + " " + (STACK[name] || "")).toLowerCase().includes(query);
    const hit = okPlat && okText;
    b.classList.toggle("hit", hit);
    const list = coOf(name, state);
    const coHit = !coFilter || (list !== null && list.includes(coFilter));
    b.classList.toggle("co-hit", coHit);
    if(hit && query) reveal(b);
  });
  draw();
}

/* ---------- компаниуд ---------- */
function paintCompanies(){
  byName.forEach((b, name) => {
    const box = b.querySelector(".co");
    if(!box) return;
    const list = coOf(name, state);
    box.textContent = "";
    b.classList.remove("sunset");
    if(list === null) return;
    if(state === "tgt" && list.length === 0){ b.classList.add("sunset"); return; }
    if(list.length > 3){
      const e = document.createElement("em");
      e.className = "many";
      e.textContent = list.length + " " + T("n_many");
      e.title = list.map(coName).join(", ");
      box.appendChild(e);
      return;
    }
    list.forEach(c => {
      const e = document.createElement("em");
      e.appendChild(mark(c));
      const t = document.createElement("span");
      t.textContent = coName(c);
      e.appendChild(t);
      if(coFilter === c) e.classList.add("on");
      box.appendChild(e);
    });
  });
  applyFilter();
}

function buildRail(){
  const rail = $("rail");
  const counts = {};
  CO_ORDER.forEach(c => counts[c] = 0);
  const seen = new Set();
  byName.forEach((b, name) => {
    if(b.dataset.plat === "layer") return;
    const key = CO_ALIAS[name] || name;
    if(seen.has(key)) return;
    seen.add(key);
    (coOf(name, state) || []).forEach(c => { if(c in counts) counts[c]++; });
  });
  rail.querySelectorAll("button").forEach(x => x.remove());
  CO_ORDER.forEach(c => {
    const b = document.createElement("button");
    b.type = "button";
    b.appendChild(mark(c));
    const s = document.createElement("span");
    s.textContent = coName(c);
    b.appendChild(s);
    const i = document.createElement("i");
    i.textContent = counts[c];
    b.appendChild(i);
    b.setAttribute("aria-pressed", String(coFilter === c));
    b.onclick = () => { coFilter = (coFilter === c) ? null : c; buildRail(); paintCompanies(); };
    rail.appendChild(b);
  });
}

/* ---------- chrome i18n ---------- */
function applyTx(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-tx]").forEach(el => {
    el.textContent = T(el.dataset.tx);
  });
  document.querySelectorAll("[data-tx-ph]").forEach(el => {
    el.setAttribute("placeholder", T(el.dataset.txPh));
  });
  document.querySelectorAll("[data-tx-aria]").forEach(el => {
    el.setAttribute("aria-label", T(el.dataset.txAria));
  });
  document.title = T("h1");
}

/* ---------- render ---------- */
function render(){
  const keepSel = selected;
  byName.clear(); accOf.clear(); appCount = 0;
  ["top-layers","cols","bot-layers"].forEach(id => $(id).textContent = "");
  selected = null;

  try{ buildLayers("top", $("top-layers")); }catch(e){ console.error("layers-top", e); }
  try{ buildColumns(); }catch(e){ console.error("columns", e); }
  try{ buildLayers("bot", $("bot-layers")); }catch(e){ console.error("layers-bot", e); }

  document.body.classList.toggle("tgt", state === "tgt");
  if(document.body.classList.contains("overview")){
    document.querySelectorAll(".grp").forEach(g => {
      if(!g.dataset.keep){
        g.classList.add("shut");
        g.querySelector(".gh").setAttribute("aria-expanded","false");
      }
    });
  }

  $("n-app").textContent = appCount;
  $("n-co").textContent = CO_ORDER.length;
  $("n-int").textContent = Object.keys(API_META).length;
  applyTx();
  buildRail();
  paintCompanies();
  if(keepSel && byName.has(keepSel)) select(keepSel);
  requestAnimationFrame(draw);
}

/* ---------- events ---------- */
document.querySelectorAll("[data-lang]").forEach(b => {
  b.onclick = () => {
    lang = b.dataset.lang;
    document.querySelectorAll("[data-lang]").forEach(x =>
      x.setAttribute("aria-pressed", String(x === b)));
    render();
  };
});
document.querySelectorAll("[data-f]").forEach(b => {
  b.onclick = () => {
    filter = b.dataset.f;
    document.querySelectorAll("[data-f]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    applyFilter();
  };
});
document.querySelectorAll("[data-m]").forEach(b => {
  b.onclick = () => {
    const detail = b.dataset.m === "detail";
    document.body.classList.toggle("overview", !detail);
    document.querySelectorAll("[data-m]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    document.querySelectorAll(".grp").forEach(g => {
      g.classList.toggle("shut", !detail && !g.dataset.keep);
      g.querySelector(".gh").setAttribute("aria-expanded", String(detail || !!g.dataset.keep));
    });
    if(selected) reveal(byName.get(selected));
    requestAnimationFrame(draw);
  };
});
document.querySelectorAll("[data-s]").forEach(b => {
  b.onclick = () => {
    state = b.dataset.s;
    document.querySelectorAll("[data-s]").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    render();
  };
});
$("q").addEventListener("input", e => {
  query = e.target.value.trim().toLowerCase();
  applyFilter();
});
$("close").onclick = closeDrawer;
$("d-copy").onclick = async () => {
  const btn = $("d-copy");
  try{ await navigator.clipboard.writeText(location.href); btn.textContent = T("d_copied"); }
  catch(err){ btn.textContent = T("d_failed"); }
  setTimeout(() => btn.textContent = T("d_copy"), 1600);
};
document.addEventListener("keydown", e => { if(e.key === "Escape") closeDrawer(); });
addEventListener("resize", draw);

render();

if(location.hash){
  const want = location.hash.slice(1);
  for(const n of byName.keys()) if(slug(n) === want){ select(n, true); break; }
}

</script>
